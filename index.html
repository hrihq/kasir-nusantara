<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kasir Nusantara — Aplikasi Kasir Warung</title>
    <meta name="description" content="Aplikasi kasir modern: PPN otomatis, cetak struk, kelola menu, dan grafik pemasukan-pengeluaran." />
    <meta name="theme-color" content="#b23b22" />
    <script>
      try {
        var t = localStorage.getItem('kasir_tema')
        if (t === 'gelap' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
