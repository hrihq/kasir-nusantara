<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kasir Nusantara — Aplikasi Kasir Warung</title>
    <meta name="description" content="Aplikasi kasir modern: PPN otomatis, cetak struk, kelola menu, dan grafik pemasukan-pengeluaran." />
    <meta name="theme-color" content="#b23b22" />
    <script>
      try {
        var m = localStorage.getItem('kasir_tema') || 'sistem'
        var g = m === 'gelap' || (m === 'sistem' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', g)
        var tw = localStorage.getItem('kasir_tema_warna')
        if (tw && ['klasik', 'laut', 'rimba'].indexOf(tw) !== -1) {
          document.documentElement.dataset.tema = tw
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
